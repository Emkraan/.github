name: Agent task
description: Work for an agent to pick up.
title: "[Agent]: "
labels: ["agent:tackle-now"]
body:
  - type: markdown
    attributes:
      value: |
        This form applies the `agent:tackle-now` label, which is what routes the issue to an agent. Write it so someone with no other context can finish it: the goal, the proof it is done, and any links.
        Do not paste secrets, tokens or credentials into this issue.

  - type: textarea
    id: goal
    attributes:
      label: Goal
      description: What outcome do you want, in one or two sentences?
    validations:
      required: true

  - type: dropdown
    id: work_type
    attributes:
      label: Type of work
      options:
        - Bug fix
        - Feature
        - Chore or maintenance
        - Documentation
        - Investigation (report back, no change)
    validations:
      required: true

  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance criteria
      description: Checkable conditions that mean this is done, and how to verify each.
      placeholder: "- [ ] ...\n- [ ] ..."
    validations:
      required: true

  - type: dropdown
    id: merge_policy
    attributes:
      label: Merge policy
      description: The agent opens a PR from its own worktree. Choose how far it may take it.
      options:
        - Auto-merge on green CI
        - Open the PR and wait for operator sign-off
    validations:
      required: true

  - type: textarea
    id: context
    attributes:
      label: Context and links
      description: Related issues, PRs, Apollo pages, logs, constraints.

  - type: checkboxes
    id: terms
    attributes:
      label: Checklist
      options:
        - label: This issue contains no secrets, tokens or credentials.
          required: true
        - label: I searched for an existing issue covering this work.
          required: true
