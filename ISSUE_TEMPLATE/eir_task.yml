name: Eir task
description: Work for Eir to pick up (homelab orchestrator).
title: "[Eir]: "
labels: ["agent:eir"]
body:
  - type: markdown
    attributes:
      value: |
        This form applies the `agent:eir` label, which is what routes the issue to Eir. Write it so someone with no other context can finish it: the goal, the proof it is done, and any links.
        Do not paste secrets, tokens or credentials into this issue.

  - type: textarea
    id: goal
    attributes:
      label: Goal
      description: What outcome do you want, in one or two sentences?
    validations:
      required: true

  - type: dropdown
    id: work_type
    attributes:
      label: Type of work
      options:
        - Bug fix
        - Feature
        - Chore or maintenance
        - Documentation
        - Investigation (report back, no change)
    validations:
      required: true

  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance criteria
      description: Checkable conditions that mean this is done, and how to verify each.
      placeholder: "- [ ] ...\n- [ ] ..."
    validations:
      required: true

  - type: dropdown
    id: autonomy
    attributes:
      label: Autonomy
      description: How far Eir may go without a human.
      options:
        - Investigate and report only
        - Propose a change for sign-off
        - Act and report
    validations:
      required: true

  - type: textarea
    id: context
    attributes:
      label: Context and links
      description: Related issues, PRs, Apollo pages, logs, constraints.

  - type: checkboxes
    id: terms
    attributes:
      label: Checklist
      options:
        - label: This issue contains no secrets, tokens or credentials.
          required: true
        - label: I searched for an existing issue covering this work.
          required: true
